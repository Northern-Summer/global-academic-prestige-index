name: CI and observation release validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Committed institution aggregate manifest to validate
        required: true
        default: outputs/global/manifest.json
        type: string
      browser:
        description: Run bounded production browser acceptance with hosted Chrome
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gapi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAPI_CODE_ONLY: '1'
    steps:
      # Official refs checked with git ls-remote on 2026-10-29.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --no-deps -e .
      - run: python -m gapi demo --out-dir data/demo
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/build-provenance.mjs verify
  real-observation-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAPI_CODE_ONLY: '0'
      GAPI_RELEASE_MANIFEST: ${{ inputs.release_manifest || 'outputs/global/manifest.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # No network publication: rejects uncommitted sources/data, incorrect base,
      # stale build inputs and modified output bytes.
      - run: node scripts/build-provenance.mjs verify --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-observation-site
          path: dist
          retention-days: 7
  production-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: real-observation-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GAPI_CODE_ONLY: '0'
      GAPI_RELEASE_MANIFEST: ${{ inputs.release_manifest || 'outputs/global/manifest.json' }}
      GAPI_PUBLIC_TEST: '1'
      GAPI_TEST_URL: http://127.0.0.1:4173/global-academic-prestige-index/
      GAPI_BROWSER: /usr/bin/google-chrome
      GAPI_PLAYWRIGHT: playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-provenance.mjs verify --publish
      # Hosted-runner-only dependency, no browser download or lockfile mutation.
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Production route and browser acceptance
        shell: bash
        run: |
          test -x "$GAPI_BROWSER"
          npm run preview -- --port 4173 > /tmp/gapi-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$GAPI_TEST_URL" >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-real.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            outputs/browser-review-2026-10-29.json
            outputs/review-*-2026-10-29.png
          retention-days: 7
# Existing production remains legacy gh-pages. CI does not change Pages mode;
# the reviewed publisher performs non-force publication and remote readback.
