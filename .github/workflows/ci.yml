name: CI
env:
  GAPI_CODE_ONLY: '1'
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --no-deps -e .
      - run: python -m gapi demo --out-dir data/demo
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GAPI_PAGES_RELEASE_APPROVED == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --no-deps -e .
      - run: python -m gapi demo --out-dir data/demo
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
