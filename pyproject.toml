[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapi"
version = "0.1.0"
description = "Reproducible academic talent-flow network ranking"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "GAPI contributors"}]
dependencies = []

[project.optional-dependencies]
analysis = ["duckdb==1.4.1"]

[project.scripts]
gapi = "gapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
